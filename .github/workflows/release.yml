name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  verify:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release-smoke:
    needs: [release-please, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release candidate
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --skip=publish --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release candidate
        shell: bash
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          expected_assets=(
            "jiro_${TAG}_darwin_amd64"
            "jiro_${TAG}_darwin_arm64"
            "jiro_${TAG}_linux_amd64"
            "jiro_${TAG}_linux_arm64"
            "jiro_${TAG}_windows_amd64.exe"
            "jiro_${TAG}_windows_arm64.exe"
          )
          mapfile -t actual_assets < <(
            jq -r '.[] | select(.extra.Format == "binary") | .name' dist/artifacts.json | sort
          )
          if [[ "${actual_assets[*]}" != "${expected_assets[*]}" ]]; then
            echo "Release assets do not match the expected OS/architecture matrix." >&2
            printf 'Expected: %s\n' "${expected_assets[*]}" >&2
            printf 'Actual:   %s\n' "${actual_assets[*]}" >&2
            exit 1
          fi

          checksum="dist/jiro_${TAG}_checksums.txt"
          if [[ ! -f "$checksum" ]] || [[ $(wc -l < "$checksum") -ne 6 ]]; then
            echo "Expected one checksum entry for each release binary." >&2
            exit 1
          fi

          binary="$(
            jq -r '.[] | select(.extra.Format == "binary" and .goos == "linux" and .goarch == "amd64") | .path' \
              dist/artifacts.json
          )"
          expected="jiro version ${TAG#v}"
          actual="$("$binary" --version)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Version output $actual does not match $expected." >&2
            exit 1
          fi

  release:
    needs: [release-please, release-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-container:
    needs: [release-please, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: image
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: ./scripts/container-metadata.sh "$IMAGE" "$TAG" "$GITHUB_OUTPUT"

      - name: Build and push container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true

  update-homebrew:
    needs: [release-please, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Homebrew tap
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: timonwong/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_PRIVATE_KEY }}
          path: tap

      - name: Update Homebrew tap
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          cd tap
          ./scripts/update-jiro "$TAG"

      - name: Commit Homebrew tap update
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          repository: tap
          file_pattern: Formula/jiro.rb
          commit_message: jiro ${{ needs.release-please.outputs.version }}
          commit_user_name: goreleaserbot
          commit_user_email: bot@goreleaser.com
          commit_author: goreleaserbot <bot@goreleaser.com>
